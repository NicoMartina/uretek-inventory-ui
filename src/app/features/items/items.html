<div class="items-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Items</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <table mat-table [dataSource]="items">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let item">{{ item.name }}</td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let item">{{ item.category }}</td>
        </ng-container>

        <ng-container matColumnDef="unit">
          <th mat-header-cell *matHeaderCellDef>Unit</th>
          <td mat-cell *matCellDef="let item">{{ item.unit }}</td>
        </ng-container>

        <ng-container matColumnDef="currentStock">
          <th mat-header-cell *matHeaderCellDef>Current Stock</th>
          <td mat-cell *matCellDef="let item" [class.low-stock]="isLowStock(item)">
            {{ item.currentStock }}
          </td>
        </ng-container>

        <ng-container matColumnDef="minimumStock">
          <th mat-header-cell *matHeaderCellDef>Minimum Stock</th>
          <td mat-cell *matCellDef="let item">{{ item.minimumStock }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
